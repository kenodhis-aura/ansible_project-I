---

- hosts: all
  become: true
  tasks:

  - name: install updates (REHL10)
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution == "REHL10"

  - name: install updates (Ubuntu)
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"

- hosts: web_servers
  become: true
  tasks:

  - name: install apache & php for Ubuntu servers
    apt:
      name:
        - apache2
        - libapache2-mod-php
      state: latest
    when: ansible_distribution == "Ubuntu"

  - name: install apache and php for REHL10 servers
    dnf:
      name:
        - httpd
        - php
      state: latest
    when: ansible_distribution == "REHL10"

- hosts: db_servers
  become: true
  tasks:

  - name: install mariadb package (REHL10)
    dnf:
      name: mariadb
      state: latest
    when: ansible_distribution == "REHL10"

  - name: install mariadb package (Ubuntu)
    apt:
      name: mariadb-server
      state: latest
    when: ansible_distribution == "Ubuntu"

- hosts: file_servers
  become: true
  tasks:

  - name: install samba package
    package:
      name: samba
      state: latest
